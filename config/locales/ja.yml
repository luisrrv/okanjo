ja:
  app:
    name: 割り勘

  date:
    formats:
      # rails-i18n's long format pads with zeros (2026年12月02日); this reads more naturally.
      long: "%Y年%-m月%-d日(%a)"

  activerecord:
    models:
      group: イベント
      member: メンバー
      expense: 支払い
      participation: 割り勘メンバー
    attributes:
      group:
        name: イベント名
        members: メンバー
      group/members:
        name: あなたの名前
      member:
        name: 名前
      expense:
        description: 内容
        amount: 金額
        payer: 支払った人
        members: 割り勘するメンバー
      participation:
        member: メンバー
    errors:
      models:
        member:
          # Replaces rails-i18n's "%{record}が存在しているので削除できません", which
          # would show the raw association name ("participations").
          restrict_dependent_destroy:
            has_many: 支払いや割り勘に含まれているため削除できません
        expense:
          attributes:
            # These are a select and checkboxes, so "choose" (選択), not "enter" (入力).
            payer:
              required: を選択してください
              not_in_group: はこのイベントのメンバーではありません
            members:
              blank: を選択してください
              not_in_group: にこのイベント以外のメンバーが含まれています

  shared:
    errors:
      heading: 入力内容を確認してください

  groups:
    new:
      title: 割り勘をはじめる
      name_label: イベント名（任意）
      name_placeholder: 例：忘年会、箱根旅行
      your_name_label: あなたの名前
      submit: 作成する
      recent: 最近開いたイベント
      members_count: "%{count}人"
    create:
      created: イベントを作成しました
    show:
      deletion_notice: 変更がない場合、%{date}に削除されます
      share_link: このリンクを共有してください
      you_are: あなた：%{name}さん
      change_identity: 変更
      receipt_link: 明細を印刷

  members:
    members:
      heading: メンバー
      you: あなた
      remove: 削除
      remove_confirm: "%{name}さんを削除しますか？"
      name_placeholder: 名前
      submit: 追加
    create:
      created: "%{name}さんを追加しました"
    destroy:
      destroyed: "%{name}さんを削除しました"

  identities:
    banner:
      title: あなたの名前を選んでください
      not_listed: リストにない場合は追加
      add_me: 追加
    create:
      created: "%{name}さんとして表示しています"

  expenses:
    form:
      default_description: お会計 %{number}
      yen: 円
      payer: 支払った人
      payer_prompt: 選択してください
      split: 割り勘するメンバー
      submit: 保存する
      confirm_payer_out: "%{payer}さんは割り勘に含まれません。%{others}で%{amount}を割り勘し、1人%{share}になります。よろしいですか？"
      confirm_payer_out_without_amount: "%{payer}さんは割り勘に含まれません。よろしいですか？"
      honorific_name: "%{name}さん"
      name_separator: 、
      currency: "%{amount}円"
    new:
      title: 支払いを追加
      back: 戻る
    edit:
      title: 支払いを編集
      back: 戻る
    create:
      created: 支払いを追加しました
    update:
      updated: 支払いを更新しました
    destroy:
      destroyed: 支払いを削除しました
    expenses:
      heading: 支払い
      add: 追加
      empty: まだ支払いがありません。「追加」から記録しましょう。
    expense:
      share: 1人 %{share} × %{count}人
      odd_yen: 端数 %{amount}（%{payer}さん）
      payer: 支払い：%{payer}さん
      payer_not_sharing: 支払い：%{payer}さん（割り勘の対象外）
      edit: 編集
      destroy: 削除
      destroy_confirm: 「%{description}」を削除しますか？

  settlements:
    settlement:
      heading: 精算
      row: 立て替え %{credited} · 負担 %{owed}
      receives: "+%{amount}"
      pays: "−%{amount}"
      collector: "%{name}さんがまとめて精算します"
      transfer: "%{from}さん → %{to}さん"
      nothing: 精算はありません

  receipts:
    show:
      title: 割り勘の明細
      printed_on: 発行日：%{date}
      print: 印刷・PDFで保存
      back: 戻る
      expenses: 支払い一覧
      paid_by: 支払い：%{payer}さん
      split_among: 割り勘：%{names}（1人 %{share}）
      honorific_name: "%{name}さん"
      name_separator: 、
      total: 合計
      settlement: 精算
      empty: 支払いはありません
      footer: 割り勘（%{url}）で作成
