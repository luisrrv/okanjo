      confirm_payer_out_without_amount: "%{payer}さんを割り勘の対象から外しますか？"
      honorific_name: "%{name}さん"
      name_separator: 、
      currency: "%{amount}円"
    new:
      title: 支払いを追加
      back: 戻る
    edit:
      title: 支払いを編集
      back: 戻る
    create:
      created: 支払いを追加しました
    update:
      updated: 支払いを更新しました
    destroy:
      destroyed: 支払いを削除しました
    expenses:
      heading: 支払い
      add: 追加
      empty: 支払いはまだ登録されていません。「追加」から登録してください。
    expense:
      share: 1人あたり %{share} × %{count}人
      odd_yen: 端数の%{amount}は%{payer}さんが受け取ります
      payer: 支払った人：%{payer}さん
      payer_not_sharing: 支払った人：%{payer}さん（本人は割り勘の対象外）
      edit: 編集
      destroy: 削除
      destroy_confirm: 「%{description}」を削除しますか？

  settlements:
    settlement:
      heading: 精算
      row: 立替額 %{credited} · 負担額 %{owed}
      receives: "+%{amount}"
      pays: "−%{amount}"
      collector: "%{name}さんが代表して精算します"
      transfer: "%{from}さん → %{to}さん"
      nothing: 精算する金額はありません

  receipts:
    show:
      title: 割り勘の精算明細
      printed_on: 発行日：%{date}
      print: 印刷／PDFで保存
      back: 戻る
      expenses: 支払い一覧
      paid_by: 支払った人：%{payer}さん
      split_among: 割り勘の対象：%{names}（1人あたり %{share}）
      honorific_name: "%{name}さん"
      name_separator: 、
      total: 合計
      settlement: 精算
      empty: 支払いはありません
      footer: 割り勘（%{url}）で作成

  # Accounts (ADR 0022, docs/specs/accounts.md)
  rate_limited: しばらくしてからもう一度お試しください

  layouts:
    application:
      sign_in: ログイン
      sign_out: ログアウト

  sessions:
    new:
      title: ログイン
      email: メールアドレス
      password: パスワード
      submit: ログイン
      forgot: パスワードを忘れた場合
      sign_up: アカウントを作成
    create:
      invalid: メールアドレスかパスワードが正しくありません

  registrations:
    new:
      title: アカウント作成
