ja:
  app:
    name: 割り勘

  date:
    formats:
      # rails-i18n's long format pads with zeros (2026年12月02日); this reads more naturally.
      long: "%Y年%-m月%-d日(%a)"

  activerecord:
    models:
      group: イベント
      member: メンバー
      expense: 支払い
      participation: 割り勘メンバー
      user: アカウント
    attributes:
      group:
        name: イベント名
        members: メンバー
      group/members:
        name: あなたの名前
      member:
        name: 名前
        user_id: アカウント
      expense:
        description: 内容
        amount: 金額
        payer: 支払った人
        members: 割り勘の対象メンバー
      participation:
        member: メンバー
      user:
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
    errors:
      models:
        member:
          # Replaces rails-i18n's "%{record}が存在しているので削除できません", which
          # would show the raw association name ("participations").
          restrict_dependent_destroy:
            has_many: このメンバーは支払いまたは割り勘の対象に含まれているため、削除できません
          claimed_by_other: このメンバーは別のアカウントと連携済みです
          attributes:
            name:
              taken: が同じメンバーがすでにいます
            user_id:
              taken: はこのイベントの別のメンバーと連携済みです
        expense:
          attributes:
            # These are a select and checkboxes, so "choose" (選択), not "enter" (入力).
            payer:
              required: を選択してください
              not_in_group: がこのイベントのメンバーに含まれていません
            members:
              blank: を選択してください
              not_in_group: に別のイベントのメンバーが含まれています
            amount:
              not_a_number: を数字で入力してください
              greater_than: は1円以上で入力してください
              less_than_or_equal_to: が上限（2,000,000,000円）を超えています

  shared:
    errors:
      heading: 入力内容を確認してください

  groups:
    new:
      title: 割り勘をはじめる
      name_label: イベント名（任意）
      name_placeholder: 例：忘年会、箱根旅行
      your_name_label: あなたの名前
      submit: 作成する
      mine: 自分の割り勘
      recent: 最近開いたイベント
      members_count: "%{count}人"
    create:
      created: イベントを作成しました
    show:
      deletion_notice: 変更がなければ、%{date}に自動で削除されます
      share_link: このリンクを共有してください
      you_are: あなた：%{name}さん
      change_identity: 変更
      receipt_link: 精算明細を印刷

  members:
    members:
      heading: メンバー
      you: あなた
      remove: 削除
      remove_confirm: "%{name}さんを削除しますか？"
      name_placeholder: 名前
      submit: 追加
    create:
      created: "%{name}さんを追加しました"
    destroy:
      destroyed: "%{name}さんを削除しました"

  identities:
    banner:
      title: ご自身の名前を選んでください
      not_listed: 名前がない場合は追加してください
      add_me: 追加
      claimed: 連携済み
    create:
      created: "%{name}さんとして表示しています"

  expenses:
    form:
