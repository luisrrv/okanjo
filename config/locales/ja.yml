      submit: 作成する
      sign_in: アカウントをお持ちの方はログイン
    create:
      created: アカウントを作成しました

  passwords:
    invalid_token: リンクが無効か、有効期限が切れています
    new:
      title: パスワードの再設定
      note: 登録したメールアドレスに、再設定用のリンクを送ります。
      email: メールアドレス
      submit: 送信する
    create:
      sent: メールアドレスが登録されていれば、再設定用のリンクを送りました。
    edit:
      title: 新しいパスワード
      password: 新しいパスワード
      password_confirmation: 新しいパスワード（確認）
      submit: 変更する
    update:
      updated: パスワードを変更しました。ログインしてください。

  passwords_mailer:
    reset:
      subject: 【割り勘】パスワードの再設定
      body: 下のリンクからパスワードを再設定してください。リンクの有効期限は%{expires_in}です。
      ignore: 心当たりがない場合は、このメールを無視してください。
