<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06c755" />
    <meta property="og:title" content="割り勘" />
    <meta property="og:description" content="LINEチャットで使える割り勘アプリ。金額と人数を入れて、チャットに送るだけ。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://warikan.lrod.dev/liff" />
    <meta property="og:image" content="https://warikan.lrod.dev/liff/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="description" content="LINEチャットで使える割り勘アプリ。金額と人数を入れて、チャットに送るだけ。" />
    <title>割り勘</title>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1 class="title" data-i18n="appTitle"></h1>
        <nav class="nav" aria-label="メニュー">
          <button type="button" class="nav-btn" id="nav-calculator" data-i18n="calculator" hidden></button>
          <button type="button" class="nav-btn" id="nav-occasions" data-i18n="myOccasions" hidden></button>
          <button type="button" class="nav-btn" id="sign-in" data-i18n="signIn"></button>
          <button type="button" class="nav-btn" id="sign-out" data-i18n="signOut" hidden></button>
        </nav>
      </header>

      <p class="message" id="message" role="alert" hidden></p>

      <section class="view" id="calculator">
        <div class="field">
          <label class="label" for="total" data-i18n="totalLabel"></label>
          <div class="input-wrap">
            <input id="total" type="text" inputmode="numeric" autocomplete="off" class="input" />
            <span class="suffix" data-i18n="yen"></span>
          </div>
        </div>

        <div class="field">
          <label class="label" for="people" data-i18n="peopleLabel"></label>
          <div class="input-wrap">
            <input id="people" type="text" inputmode="numeric" autocomplete="off" class="input" />
            <span class="suffix" data-i18n="people"></span>
          </div>
        </div>

        <div class="result">
          <span class="result-label" data-i18n="perPersonLabel"></span>
          <span class="result-value" id="result">—</span>
        </div>
        <p class="muted" id="surplus" hidden></p>

        <button type="button" class="share-btn" id="share" disabled data-i18n="shareButton"></button>
      </section>

      <section class="view" id="occasions" hidden>
        <h2 class="view-title" data-i18n="myOccasions"></h2>
        <button type="button" class="share-btn" id="new-occasion" data-i18n="newOccasion"></button>
        <p class="muted" id="occasions-status"></p>
        <ul class="occasion-list" id="occasion-list"></ul>
        <button type="button" class="nav-btn" id="link-email" data-i18n="linkEmail" hidden></button>
      </section>

      <!-- An occasion, or one of its forms; built in occasion.ts. -->
      <section id="screen" hidden></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
