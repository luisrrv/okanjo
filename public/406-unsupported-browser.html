<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Static page served without the app, so the copy is written here, not in config/locales (ADR 0018). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>お使いのブラウザには対応していません（406）｜割り勘</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fafaf9; color: #1c1917; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    header { border-bottom: 1px solid #e7e5e4; background: #fff; }
    header a, main { display: block; max-width: 36rem; margin: 0 auto; padding: 0.75rem 1rem; }
    header a { color: inherit; font-size: 1.125rem; font-weight: 700; text-decoration: none; }
    main { padding-top: 1.5rem; }
    .card { background: #fff; border-radius: 0.5rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); padding: 1.5rem 1rem; }
    .code { margin: 0; color: #78716c; font-size: 0.875rem; }
    h1 { margin: 0.25rem 0 0.75rem; font-size: 1.5rem; }
    p { margin: 0 0 0.5rem; }
    .button { display: block; margin-top: 1.25rem; border-radius: 0.375rem; background: #1c1917; color: #fff; font-weight: 700; padding: 0.75rem 1rem; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <header><a href="/">割り勘</a></header>
  <main>
    <div class="card">
      <p class="code">エラー 406</p>
      <h1>お使いのブラウザには対応していません</h1>
      <p>Chrome、Safari、Firefox、Edgeなどの最新版で開いてください。</p>
      <a class="button" href="/">割り勘をはじめる</a>
    </div>
  </main>
</body>
</html>
